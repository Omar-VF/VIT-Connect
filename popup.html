<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIT-Connect</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090d16;
      --surface: #121826;
      --surface-hover: #1a2235;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --text: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --danger: #ef4444;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
    }

    body {
      width: 300px;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      padding: 10px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      border-radius: 8px;
      object-fit: cover;
      display: block;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background-color 0.2s;
    }

    .status-badge.active .status-dot {
      background: var(--success);
    }

    /* Modern Switch Toggle */
    .toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      transition: background-color 0.2s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    input:checked + .toggle-slider {
      background-color: var(--primary);
    }

    input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }

    /* Content Body */
    .content {
      padding: 12px 14px;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 11px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 12.5px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--border-focus);
    }

    .pass-input {
      padding-right: 34px !important;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      border-radius: var(--radius-sm);
      transition: color 0.15s;
    }

    .toggle-pass-btn:hover {
      color: var(--text);
    }

    .toggle-pass-btn svg {
      width: 15px;
      height: 15px;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8.5px;
      cursor: pointer;
      transition: background-color 0.15s;
      margin-top: 2px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .btn-secondary {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background-color: var(--surface-hover);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-github {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn-github:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-github:active {
      transform: scale(0.99);
    }

    /* Saved State View */
    .saved-state {
      display: none;
    }

    .saved-state.visible {
      display: block;
    }

    .edit-form.hidden {
      display: none;
    }

    .credential-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 9px;
    }

    .credential-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .credential-item + .credential-item {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .credential-info {
      display: flex;
      flex-direction: column;
    }

    .credential-label {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .credential-value {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
    }

    .lock-badge {
      color: var(--success);
      opacity: 0.8;
      display: flex;
      align-items: center;
    }

    .status-msg {
      display: none;
      font-size: 11.5px;
      font-weight: 500;
      text-align: center;
      margin-top: 8px;
    }

    .status-msg:not(:empty) {
      display: block;
    }

    .status-msg.ok {
      color: var(--success);
    }

    .status-msg.err {
      color: var(--danger);
    }

    /* Footer */
    .footer {
      padding: 9px 14px;
      background: rgba(0, 0, 0, 0.12);
      border-top: 1px solid var(--border);
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.35;
    }

    .footer svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <img src="icon.png" width="30" height="30" alt="VIT-Connect" />
        <div class="brand-info">
          <span class="brand-title">VIT-Connect</span>
          <span class="status-badge active" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusBadgeText">Auto-login On</span>
          </span>
        </div>
      </div>

      <label class="toggle" title="Enable or disable auto-login">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- Saved View -->
      <div class="saved-state" id="savedState">
        <div class="credential-card">
          <div class="credential-item">
            <div class="credential-info">
              <span class="credential-label">Username / Reg No</span>
              <span class="credential-value" id="savedUsername">—</span>
            </div>
            <div class="lock-badge">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
          </div>
          <div class="credential-item">
            <div class="credential-info">
              <span class="credential-label">Password</span>
              <span class="credential-value">••••••••••••</span>
            </div>
            <div class="lock-badge">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="action-stack">
          <button class="btn-secondary" id="editBtn" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Edit Credentials
          </button>
          <button class="btn-github" id="githubBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            <span>Star on GitHub</span>
          </button>
        </div>
      </div>

      <!-- Edit Credentials Form -->
      <div class="edit-form" id="editForm">
        <div class="form-group">
          <label for="username">Username / Registration No.</label>
          <input type="text" id="username" placeholder="e.g. 21BCE0001" autocomplete="off" spellcheck="false" />
        </div>

        <div class="form-group">
          <label for="password">WiFi Password</label>
          <div class="input-wrapper">
            <input type="password" class="pass-input" id="password" placeholder="••••••••" autocomplete="off" />
            <button class="toggle-pass-btn" id="togglePass" type="button" title="Show or hide password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn-primary" id="saveBtn">Save Credentials</button>
      </div>

      <div class="status-msg" id="status"></div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="10" r="8"/>
        <line x1="12" y1="14" x2="12" y2="10"/>
        <line x1="12" y1="7" x2="12.01" y2="7"/>
      </svg>
      <span>Auto-logs into ProntoNetworks captive portal when connected to hostel WiFi.</span>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
