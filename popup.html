<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIT-Connect</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f14;
      --surface: #1a1c26;
      --border: #2a2d3e;
      --accent: #5ef0b0;
      --accent2: #3b82f6;
      --text: #e8eaf0;
      --muted: #6b7096;
      --danger: #f05e5e;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a1c26 0%, #111320 100%);
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 100px; height: 100px;
      background: radial-gradient(circle, rgba(94,240,176,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .wifi-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .wifi-icon svg { width: 18px; height: 18px; }

    .title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .subtitle {
      font-size: 10px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .toggle-label {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .toggle {
      position: relative;
      width: 38px; height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: rgba(94,240,176,0.25); }
    input:checked + .slider::before {
      transform: translateX(18px);
      background: var(--accent);
    }

    .body {
      padding: 16px 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94,240,176,0.1);
    }

    .pass-wrap {
      position: relative;
    }

    .pass-wrap input { padding-right: 38px; }

    .show-pass {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      transition: color 0.15s;
      display: flex; align-items: center;
    }

    .show-pass:hover { color: var(--accent); }
    .show-pass svg { width: 15px; height: 15px; }

    .save-btn {
      width: 100%;
      background: var(--accent);
      color: #0a1a12;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 10px;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .save-btn:hover { opacity: 0.9; }
    .save-btn:active { transform: scale(0.98); }

    .status {
      margin-top: 10px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      text-align: center;
      height: 16px;
      transition: color 0.3s;
    }

    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }

    /* Saved/locked state */
    .saved-state {
      display: none;
    }

    .saved-state.visible {
      display: block;
    }

    .edit-form.hidden {
      display: none;
    }

    .credential-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 10px;
    }

    .credential-label {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .credential-value {
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      color: var(--text);
      letter-spacing: 2px;
    }

    .lock-icon {
      color: var(--accent);
      opacity: 0.6;
      flex-shrink: 0;
    }

    .edit-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      padding: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      transition: border-color 0.2s, color 0.2s;
    }

    .edit-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .footer {
      padding: 10px 20px 14px;
      border-top: 1px solid var(--border);
    }

    .tip {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      line-height: 1.5;
    }

    .tip strong { color: rgba(94,240,176,0.7); font-weight: 400; }

  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="wifi-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.5 8.5C5.5 4.5 10.5 2.5 12 2.5s6.5 2 10.5 6" stroke="#0a1a12" stroke-width="2" stroke-linecap="round"/>
          <path d="M5 12c1.9-1.9 4.3-3 7-3s5.1 1.1 7 3" stroke="#0a1a12" stroke-width="2" stroke-linecap="round"/>
          <path d="M8.5 15.5c.9-.9 2.2-1.5 3.5-1.5s2.6.6 3.5 1.5" stroke="#0a1a12" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="19" r="1.5" fill="#0a1a12"/>
        </svg>
      </div>
      <div>
        <div class="title">VIT-Connect</div>
        <div class="subtitle">Hostel captive portal</div>
      </div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto-login</span>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="body">

    <!-- Saved/locked view -->
    <div class="saved-state" id="savedState">
      <div class="credential-row">
        <div>
          <div class="credential-label">Username</div>
          <div class="credential-value" id="savedUsername">—</div>
        </div>
        <svg class="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="credential-row">
        <div>
          <div class="credential-label">Password</div>
          <div class="credential-value">••••••••••</div>
        </div>
        <svg class="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <button class="edit-btn" id="editBtn">✎ Edit credentials</button>
    </div>

    <!-- Edit form -->
    <div class="edit-form" id="editForm">
      <div class="field">
        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="your-username" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="off" />
          <button class="show-pass" id="togglePass" title="Show/hide password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="save-btn" id="saveBtn">Save Credentials</button>
      <div class="status" id="status"></div>
    </div>

  </div>

  <div class="footer">
    <div class="tip">
      <strong>→</strong> Extension auto-detects captive portals and fills your login. Works on page load and after redirects.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
